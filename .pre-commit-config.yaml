repos:
  # Ruff — lint + format (backend)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
        name: ruff lint (backend)
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        name: ruff format (backend)
        files: ^backend/

  # Mypy — typecheck (backend)
  - repo: local
    hooks:
      - id: backend-mypy
        name: mypy (backend)
        entry: mypy --config-file backend/pyproject.toml backend/app
        language: system
        types: [python]
        files: ^backend/app/
        pass_filenames: false

  # ESLint + TSC (frontend)
  - repo: local
    hooks:
      - id: frontend-eslint
        name: eslint (frontend)
        entry: bash -c "cd frontend && npm run lint"
        language: system
        files: ^frontend/src/
        pass_filenames: false
      - id: frontend-tsc
        name: tsc (frontend)
        entry: bash -c "cd frontend && npm run typecheck"
        language: system
        files: ^frontend/src/
        pass_filenames: false
