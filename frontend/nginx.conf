server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Redireciona todas as rotas para o Angular (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache para assets com hash no nome (8 hex chars antes da extensão)
    location ~* \.[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]\.(js|css|woff2|woff)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
