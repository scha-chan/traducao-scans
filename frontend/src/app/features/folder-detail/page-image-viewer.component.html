<div class="image-viewer-wrapper" [class]="cursorClass()">

  <!-- Zoom controls + draw mode toggle -->
  <div class="zoom-controls" role="group" aria-label="Controles de imagem">
    <button
      type="button"
      class="zoom-btn"
      (click)="zoomOut()"
      [disabled]="zoom() <= ZOOM_MIN"
      aria-label="Diminuir zoom"
    >−</button>

    <button
      type="button"
      class="zoom-btn zoom-label"
      (click)="resetZoom()"
      aria-label="Ajustar zoom"
      title="Ajustar (100%)"
    >{{ (zoom() * 100).toFixed(0) }}%</button>

    <button
      type="button"
      class="zoom-btn"
      (click)="zoomIn()"
      [disabled]="zoom() >= ZOOM_MAX"
      aria-label="Aumentar zoom"
    >+</button>

    <span class="zoom-divider" aria-hidden="true"></span>

    <button
      type="button"
      class="zoom-btn draw-btn"
      [class.draw-btn--active]="drawModeActive()"
      (click)="toggleDrawMode()"
      [attr.aria-pressed]="drawModeActive()"
      aria-label="Adicionar região"
      title="Adicionar região (desenhar retângulo)"
    >
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <rect x="2" y="2" width="10" height="10" rx="1" stroke-dasharray="2.5 1.5"/>
        <line x1="7" y1="1" x2="7" y2="3"/>
        <line x1="7" y1="11" x2="7" y2="13"/>
        <line x1="1" y1="7" x2="3" y2="7"/>
        <line x1="11" y1="7" x2="13" y2="7"/>
      </svg>
      <span class="draw-btn-label">Região</span>
    </button>
  </div>

  <!-- Image + SVG overlay -->
  <div
    class="image-stage"
    #container
    (mousedown)="onMouseDown($event)"
  >
    @if (imageLoading()) {
      <div class="image-skeleton" aria-hidden="true"></div>
    }

    <div
      class="image-transform-root"
      [ngStyle]="{ transform: transform() }"
    >
      <img
        #pageImage
        [src]="imageUrl()"
        [alt]="altText()"
        class="page-image"
        [class.hidden]="imageLoading()"
        draggable="false"
        (load)="imageLoading.set(false)"
        (error)="imageLoading.set(false)"
      />

      <!-- SVG overlay: bbox rects + draw preview -->
      <svg
        class="bbox-overlay"
        aria-hidden="true"
        [class.hidden]="imageLoading()"
      >
        <!-- Existing block: selected badge -->
        @if (selectedBlockIndex() !== null && !drawModeActive()) {
          <rect x="0" y="0" width="2rem" height="1.25rem" rx="3" fill="none" />
          <text
            x="6"
            y="14"
            font-size="11"
            font-family="monospace"
            font-weight="bold"
            fill="oklch(0.637 0.237 25.331)"
            class="select-none"
          >{{ (selectedBlockIndex() ?? 0) + 1 }}</text>
        }

        <!-- Draw mode: crosshair guide + preview rect -->
        @if (drawModeActive()) {
          @if (drawPreviewRect(); as r) {
            <rect
              [attr.x]="r.x"
              [attr.y]="r.y"
              [attr.width]="r.w"
              [attr.height]="r.h"
              fill="oklch(0.637 0.237 25.331 / 0.12)"
              stroke="oklch(0.637 0.237 25.331)"
              stroke-width="1.5"
              stroke-dasharray="4 2"
              rx="2"
            />
          }
        }
      </svg>
    </div>
  </div>

  <!-- Draw mode hint -->
  @if (drawModeActive()) {
    <div class="draw-hint" role="status" aria-live="polite">
      Clique e arraste para definir a região. <kbd>Esc</kbd> para cancelar.
    </div>
  }

</div>
