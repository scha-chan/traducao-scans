<div class="image-viewer-wrapper" [class]="cursorClass()">

  <!-- Zoom controls -->
  <div class="zoom-controls" role="group" aria-label="Controles de zoom">
    <button
      type="button"
      class="zoom-btn"
      (click)="zoomOut()"
      [disabled]="zoom() <= ZOOM_MIN"
      aria-label="Diminuir zoom"
    >−</button>

    <button
      type="button"
      class="zoom-btn zoom-label"
      (click)="resetZoom()"
      aria-label="Ajustar zoom"
      title="Ajustar (100%)"
    >{{ (zoom() * 100).toFixed(0) }}%</button>

    <button
      type="button"
      class="zoom-btn"
      (click)="zoomIn()"
      [disabled]="zoom() >= ZOOM_MAX"
      aria-label="Aumentar zoom"
    >+</button>
  </div>

  <!-- Image + SVG overlay -->
  <div
    class="image-stage"
    #container
    (mousedown)="onMouseDown($event)"
  >
    @if (imageLoading()) {
      <div class="image-skeleton" aria-hidden="true"></div>
    }

    <div
      class="image-transform-root"
      [ngStyle]="{ transform: transform() }"
    >
      <img
        [src]="imageUrl()"
        [alt]="altText()"
        class="page-image"
        [class.hidden]="imageLoading()"
        draggable="false"
        (load)="imageLoading.set(false)"
        (error)="imageLoading.set(false)"
      />

      <!-- SVG overlay — bboxes quando a API fornecer coordenadas (I7).
           Por enquanto exibe apenas um badge com o número do bloco selecionado
           no topo-esquerdo (posição de fallback). -->
      <svg
        class="bbox-overlay"
        aria-hidden="true"
        [class.hidden]="imageLoading() || selectedBlockIndex() === null"
      >
        @if (selectedBlockIndex() !== null) {
          <rect x="0" y="0" width="2rem" height="1.25rem" rx="3" fill="none" />
          <text
            x="6"
            y="14"
            font-size="11"
            font-family="monospace"
            font-weight="bold"
            fill="oklch(0.637 0.237 25.331)"
            class="select-none"
          >{{ (selectedBlockIndex() ?? 0) + 1 }}</text>
        }
      </svg>
    </div>
  </div>

</div>
